<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Trevecca Basketball Tracker</title><style>body{font-family:Arial;background:#f4f4f4;padding:20px}.container{max-width:800px;margin:auto;background:white;padding:20px;border-radius:10px}input,button{padding:10px;margin:5px}button{background:#4b2e83;color:white;border:none}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:8px}th{background:#4b2e83;color:white}</style></head><body><div class="container"><h1>🏀 Trevecca Basketball Tracker</h1><p>Track player stats during practices and games.</p><input id="name" placeholder="Player Name"><input id="points" type="number" placeholder="Points"><input id="rebounds" type="number" placeholder="Rebounds"><input id="assists" type="number" placeholder="Assists"><button onclick="addPlayer()">Add Stats</button><table><thead><tr><th>Player</th><th>Points</th><th>Rebounds</th><th>Assists</th><th>Score</th></tr></thead><tbody id="stats"></tbody></table></div><script>function addPlayer(){const n=document.getElementById('name').value;const p=+document.getElementById('points').value;const r=+document.getElementById('rebounds').value;const a=+document.getElementById('assists').value;const s=(p+r*1.2+a*1.5).toFixed(1);document.getElementById('stats').innerHTML+=`<tr><td>${n}</td><td>${p}</td><td>${r}</td><td>${a}</td><td>${s}</td></tr>`;}</script></body></html>
